# Development environment for the React client. `docker compose up` runs the
# Vite dev server in a container at http://localhost:5173, joined to the
# API's compose network ({{PEER_NAME}}_dev). The dev server proxies /api/*
# to the Rails API at http://app:3000 (see vite.config.ts), so the browser
# keeps a single origin — auth cookies flow with no CORS setup.
#
# Start the API first — its scripts/docker-setup (or docker compose up)
# creates the network this file joins:
#   cd ../{{PEER_NAME}} && docker compose up
#
# Running on the host with `npm run dev` works too (the proxy then targets
# http://localhost:3000); the container keeps its own node_modules in a
# named volume, so the two never conflict.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Override the host port when 5173 is taken: WEB_PORT=5273 docker compose up
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://app:3000

networks:
  default:
    external: true
    name: {{PEER_NAME}}_dev

volumes:
  node_modules:
