# Development environment. `docker compose up` runs the Vite dev server in a
# container at http://localhost:5173 (the image builds on first run).
# Running on the host with `npm run dev` works too — the container keeps its
# own node_modules in a named volume, so the two never conflict.
#
# To talk to a backend running in another compose project — e.g. a Rails app
# created by create-claude-project, whose network is named <backend>_dev:
#   1. uncomment the `networks:` block below and set the backend's network name
#   2. uncomment VITE_API_PROXY_TARGET, pointing at the backend's service
#      (the Rails scaffold's app service is reachable at http://app:3000)
# The dev server proxies /api/* to that target (see vite.config.ts), so the
# browser keeps a single origin — no CORS setup needed.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Override the host port when 5173 is taken: WEB_PORT=5273 docker compose up
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # environment:
    #   VITE_API_PROXY_TARGET: http://app:3000

# networks:
#   default:
#     external: true
#     name: my-rails-backend_dev

volumes:
  node_modules:
